<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>蔵書管理アプリ（iPhone対応）</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 p-4">

  <div class="max-w-md mx-auto">
    <h1 class="text-xl font-bold text-center mb-4">📚 蔵書管理アプリ</h1>

    <!-- カメラ映像 -->
    <div id="reader" style="width: 100%; max-width: 360px; height: 300px;" class="mx-auto border border-gray-400 rounded mb-4"></div>

    <!-- カメラ操作 -->
    <div class="flex flex-col sm:flex-row justify-center items-center gap-2 mb-4">
      <button onclick="startScanner()" class="w-full sm:w-auto bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded">カメラ起動</button>
      <button onclick="stopScanner()" class="w-full sm:w-auto bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded">カメラ停止</button>
    </div>

    <!-- CSV操作 -->
    <div class="flex flex-col sm:flex-row justify-center items-center gap-2 mb-6">
      <button onclick="exportCSV()" class="w-full sm:w-auto bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded">エクスポート</button>
      <label class="w-full sm:w-auto bg-yellow-500 hover:bg-yellow-600 text-white px-4 py-2 rounded text-center cursor-pointer">
        インポート
        <input type="file" id="import-file" accept=".csv" class="hidden" onchange="importCSV(event)">
      </label>
    </div>

    <!-- 書籍リスト -->
    <h2 class="text-lg font-semibold mb-2">📖 登録済み書籍</h2>
    <ul id="book-list" class="space-y-2"></ul>
  </div>

  <script>
    let scanner;

    function startScanner() {
      if (scanner) return;
      scanner = new Html5Qrcode("reader");

      Html5Qrcode.getCameras().then(devices => {
        if (devices && devices.length) {
          scanner.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: { width: 250, height: 250 } },
            onScanSuccess
          ).catch(err => {
            console.error("カメラ起動エラー:", err);
            alert("カメラを開始できませんでした。Safariの設定やHTTPSをご確認ください。");
          });
        } else {
          alert("カメラが見つかりませんでした");
        }
      });
    }

    function stopScanner() {
      if (scanner) {
        scanner.stop().then(() => {
          scanner.clear();
          scanner = null;
        }).catch(err => console.error("カメラ停止エラー:", err));
      }
    }

    async function onScanSuccess(decodedText) {
      if (/^978\d{10}$/.test(decodedText)) {
        stopScanner();
        await handleISBN(decodedText);
      }
    }

    async function handleISBN(isbn) {
      let books = JSON.parse(localStorage.getItem("books") || "[]");
      if (books.some(book => book.isbn === isbn)) {
        alert("この本はすでに登録されています");
        return;
      }

      const info = await fetchBookInfo(isbn);
      if (!info) {
        alert("書籍情報を取得できませんでした");
        return;
      }

      books.unshift(info);
      localStorage.setItem("books", JSON.stringify(books));
      renderBooks();
    }

    async function fetchBookInfo(isbn) {
      try {
        const res = await fetch(`https://www.googleapis.com/books/v1/volumes?q=isbn:${isbn}`);
        const data = await res.json();
        const item = data.items?.[0];
        if (!item) return null;
        const info = item.volumeInfo;
        return {
          isbn,
          title: info.title || "タイトル不明",
          authors: info.authors || ["著者不明"]
        };
      } catch (e) {
        console.error(e);
        return null;
      }
    }

    function renderBooks() {
      const list = document.getElementById("book-list");
      const books = JSON.parse(localStorage.getItem("books") || "[]");
      list.innerHTML = "";
      books.forEach((book, index) => {
        const li = document.createElement("li");
        li.className = "bg-white p-3 rounded shadow text-sm flex justify-between items-center";
        li.innerHTML = `
          <div class="flex-1 mr-2">
            <div class="font-semibold">${book.title}</div>
            <div class="text-gray-600">${book.authors.join(", ")}</div>
            <div class="text-xs text-gray-400">ISBN: ${book.isbn}</div>
          </div>
          <button onclick="deleteBook(${index})" class="text-red-500 hover:underline text-sm">削除</button>
        `;
        list.appendChild(li);
      });
    }

    function deleteBook(index) {
      let books = JSON.parse(localStorage.getItem("books") || "[]");
      books.splice(index, 1);
      localStorage.setItem("books", JSON.stringify(books));
      renderBooks();
    }

    function exportCSV() {
      const books = JSON.parse(localStorage.getItem("books") || "[]");
      if (books.length === 0) {
        alert("エクスポートする書籍がありません");
        return;
      }
      const csv = ["Title,Authors,ISBN"];
      books.forEach(book => {
        const row = `"${book.title.replace(/"/g, '""')}","${book.authors.join(';').replace(/"/g, '""')}","${book.isbn}"`;
        csv.push(row);
      });
      const blob = new Blob([csv.join("\n")], { type: "text/csv" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "books.csv";
      a.click();
      URL.revokeObjectURL(url);
    }

    function importCSV(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function (e) {
        const lines = e.target.result.split("\n").map(l => l.trim()).filter(Boolean);
        const newBooks = [];
        for (let i = 1; i < lines.length; i++) {
          const [title, authors, isbn] = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(s => s.replace(/^"|"$/g, '').trim());
          if (!isbn || !isbn.match(/^\d{13}$/)) continue;
          newBooks.push({ title, authors: authors.split(";"), isbn });
        }

        let books = JSON.parse(localStorage.getItem("books") || "[]");
        newBooks.forEach(book => {
          if (!books.some(b => b.isbn === book.isbn)) {
            books.unshift(book);
          }
        });

        localStorage.setItem("books", JSON.stringify(books));
        renderBooks();
        event.target.value = "";
        alert("インポートが完了しました");
      };
      reader.readAsText(file);
    }

    window.onload = renderBooks;
  </script>

</body>
</html>
